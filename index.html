<script>

const db=supabase.createClient(
  "https://ncczyxjtcnchnzvrbtvy.supabase.co",
  "sb_publishable_8mVfjFwyZmo30YTOoRL-sw_o1IJ9DWm"
);

let bases=[];
let selectedType="";
let selectedStatus="";

const list=document.getElementById("list");
const count=document.getElementById("count");

const summaryTotal=
  document.getElementById("summaryTotal");

const summaryOpen=
  document.getElementById("summaryOpen");

const summaryClosed=
  document.getElementById("summaryClosed");


function escapeHTML(value){

  return String(value??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/* ================================
   สถานะ Open / Closed
================================ */

function getStatus(b){

  const raw=String(
    b.status ??
    b.state ??
    b.availability ??
    ""
  ).trim().toLowerCase();

  if(
    [
      "closed",
      "close",
      "ปิดรับ",
      "ไม่รับ",
      "unavailable"
    ].some(x=>raw.includes(x))
  ){

    return "closed";

  }

  if(
    [
      "open",
      "opened",
      "เปิดรับ",
      "รับงาน",
      "available"
    ].some(x=>raw.includes(x))
  ){

    return "open";

  }

  if(
    b.is_open===false ||
    b.open===false
  ){

    return "closed";

  }

  return "open";

}


/* ================================
   สรุปจำนวน
================================ */

function updateSummary(){

  let open=0;
  let closed=0;

  bases.forEach(b=>{

    if(getStatus(b)==="open"){
      open++;
    }else{
      closed++;
    }

  });

  summaryTotal.textContent=bases.length;
  summaryOpen.textContent=open;
  summaryClosed.textContent=closed;

}


/* ================================
   รูปจาก Supabase Storage
================================ */

function imageFor(b){

  const path=
    String(b.image_path||"").trim();

  if(path){

    const result=
      db.storage
        .from("base-images")
        .getPublicUrl(path);

    const publicUrl=
      result?.data?.publicUrl;

    if(publicUrl){

      return publicUrl;

    }

  }

  return (
    b.image_url ||
    b.image ||
    b.cover_url ||
    "images/base-01.png"
  );

}


/* ================================
   ประเภท
================================ */

function typeFor(b){

  return String(
    b.type ||
    b.category ||
    ""
  ).trim();

}


/* ================================
   ราคา
================================ */

function priceText(b){

  const price=
    b.price==null
      ? ""
      : b.price;

  const commercial=
    b.commercial_x2===true ||
    String(b.commercial_x2)
      .toLowerCase()==="true";

  return `
    PRICE : ${escapeHTML(price)}B
    · เชิงพาณิชย์ ${commercial?"×2":"×1"}
  `;

}


/* ================================
   รายละเอียด
================================ */

function detailsFor(b){

  if(Array.isArray(b.details)){

    return b.details.filter(Boolean);

  }

  if(Array.isArray(b.notes)){

    return b.notes.filter(Boolean);

  }

  const notes=
    String(b.notes||"").trim();

  if(notes){

    return notes
      .split(/\n|•/)
      .map(x=>x.trim())
      .filter(Boolean);

  }

  const result=[];

  if(b.expressions){

    result.push(
      `มีสีหน้าให้เลือกถึง ${b.expressions} สีหน้า`
    );

  }

  if(b.addons){

    result.push(
      `เพิ่มของถือ ${b.addons}`
    );

  }

  if(b.max_orders){

    result.push(
      `1คนสั่งได้สูงสุด ${b.max_orders}งาน (ต่อรอบ)`
    );

  }

  return result;

}


/* ================================
   ปุ่มตัวกรอง
================================ */

function filterButtons(){

  document
    .querySelectorAll("#typeFilters .pill")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.type===selectedType
      );

    });

  document
    .querySelectorAll("#statusFilters .pill")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.status===selectedStatus
      );

    });

}


/* ================================
   แสดง Base
================================ */

function render(){

  filterButtons();

  const result=
    bases.filter(b=>{

      const t=typeFor(b);
      const s=getStatus(b);

      const typeOK=
        !selectedType ||
        t.includes(selectedType);

      const statusOK=
        !selectedStatus ||
        s===selectedStatus;

      return typeOK && statusOK;

    });

  count.textContent=
    `พบ ${result.length} จาก ${bases.length} Base`;

  if(!result.length){

    list.innerHTML=
      '<div class="empty">ไม่พบ Base ตามตัวกรองนี้ ♡</div>';

    return;

  }

  list.innerHTML=
    result.map(b=>{

      const s=getStatus(b);

      const details=
        detailsFor(b);

      const tags=
        Array.isArray(b.tags)
          ? b.tags
          : [];

      const image=
        imageFor(b);

      const title=
        escapeHTML(
          b.name ||
          "ไม่มีชื่อ"
        );

      const type=
        escapeHTML(
          typeFor(b) ||
          "ไม่ระบุประเภท"
        );

      const owner=
        escapeHTML(
          b.owner_name ||
          b.owner ||
          "ไม่ระบุ"
        );

      const alt=
        escapeHTML(
          b.name ||
          "Nimuri Base"
        );

      return `

        <article class="card">

          <div class="cover">

            <img
              src="${escapeHTML(image)}"
              alt="${alt}"
              loading="lazy"
              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='block'
              "
            >

            <div
              class="placeholder"
              style="display:none"
            >
              ไม่สามารถโหลดรูปได้
            </div>

            <div
              class="status ${s==="closed"?"closed":""}"
            >
              ${s==="open"?"OPEN":"CLOSED"}
            </div>

          </div>

          <div class="card-body">

            <h2>
              ${title}
            </h2>

            <div class="type-label">
              ${type}
            </div>

            <div class="owner">
              baes: ${owner}
            </div>

            <div class="price">
              ${priceText(b)}
            </div>

            ${
              details.length
              ?`

                <ul class="details">

                  ${details
                    .map(
                      x=>`

                        <li>
                          ${escapeHTML(x)}
                        </li>

                      `
                    )
                    .join("")
                  }

                </ul>

              `
              :""
            }

            ${
              tags.length
              ?`

                <div class="tags">

                  ${tags
                    .map(
                      x=>`

                        <span class="tag">
                          ${escapeHTML(x)}
                        </span>

                      `
                    )
                    .join("")
                  }

                </div>

              `
              :""
            }

          </div>

        </article>

      `;

    }).join("");

}


/* ================================
   กรองประเภท
================================ */

document
  .querySelectorAll("#typeFilters .pill")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        selectedType=
          btn.dataset.type;

        render();

      }
    );

  });


/* ================================
   กรองสถานะ
================================ */

document
  .querySelectorAll("#statusFilters .pill")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        selectedStatus=
          btn.dataset.status;

        render();

      }
    );

  });


/* ================================
   โหลดข้อมูลจาก Supabase
================================ */

async function load(){

  list.innerHTML=
    '<div class="loading">กำลังโหลด Base ♡</div>';

  /*
    ดึงจาก bases โดยตรง
    เพราะ status และ image_path
    อยู่ในตารางนี้
  */

  const basesResult=
    await db
      .from("bases")
      .select(`
        id,
        name,
        owner_id,
        price,
        commercial_x2,
        max_orders,
        type,
        notes,
        status,
        image_path
      `)
      .order(
        "id",
        {ascending:true}
      );


  if(basesResult.error){

    console.log(
      "bases error:",
      basesResult.error
    );

    list.innerHTML=
      `

        <div class="error">

          โหลดข้อมูล Base ไม่สำเร็จค่ะ 🥺

          <br><br>

          ${escapeHTML(
            basesResult.error.message
          )}

        </div>

      `;

    count.textContent="";

    return;

  }


  /*
    ดึง owner และ tags
    จาก view เดิม
  */

  const tagsResult=
    await db
      .from("bases_with_tags")
      .select(`
        id,
        owner_name,
        tags
      `);


  if(tagsResult.error){

    console.log(
      "bases_with_tags error:",
      tagsResult.error
    );

  }


  const metaMap=
    new Map(
      (tagsResult.data||[])
        .map(row=>[
          row.id,
          row
        ])
    );


  /*
    รวมข้อมูลจาก bases
    กับ owner / tags
  */

  bases=
    (basesResult.data||[])
      .map(b=>{

        const meta=
          metaMap.get(b.id) || {};

        return {

          ...b,

          owner_name:
            meta.owner_name || "",

          tags:
            Array.isArray(meta.tags)
              ? meta.tags
              : []

        };

      });


  updateSummary();

  render();

}


load();

</script>
