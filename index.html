<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>NIMURI — Bases ♡</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#fff7fb;
  --white:#fff;
  --pink:#ef9fbe;
  --pink-strong:#df729f;
  --line:#efd8e2;
  --text:#40343a;
  --muted:#9b858e;
  --soft:#f8edf2;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  font-size:14px;
}

button{
  font:inherit;
}

.page{
  width:min(100%,1120px);
  margin:0 auto;
  padding:0 16px 55px;
}

header{
  text-align:center;
  padding:38px 18px 34px;
}

header h1{
  margin:0;
  font-size:29px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:-.6px;
}

header p{
  margin:8px 0 0;
  color:#a18491;
  font-size:17px;
}

.section-title{
  font-size:13px;
  font-weight:700;
  color:#8e737f;
  margin:0 0 9px;
}

.filter-section{
  margin:0 0 22px;
}

.pills{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.pill{
  border:1px solid #eccbd9;
  background:#fff;
  color:#806773;
  padding:9px 14px;
  border-radius:999px;
  cursor:pointer;
  white-space:nowrap;
  transition:.16s ease;
}

.pill:hover{
  transform:translateY(-1px);
}

.pill.active{
  background:#ef9fbe;
  color:#fff;
  border-color:#ef9fbe;
}

.base-summary{
  background:#fff;
  border:1px solid #efd8e2;
  border-radius:18px;
  padding:14px 16px;
  margin:0 0 22px;
  text-align:center;
  box-shadow:0 5px 18px rgba(150,100,125,.05);
}

.base-summary-total{
  color:#9a7585;
  font-size:15px;
  line-height:1.5;
}

.base-summary-status{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:3px;
  color:#a18491;
  font-size:13px;
}

.base-summary-status .open{
  color:#d47f9f;
}

.base-summary-status .closed{
  color:#a18491;
}

.count{
  display:none;
}

.list{
  display:grid;
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid #efd8e2;
  border-radius:21px;
  overflow:hidden;
  box-shadow:0 7px 24px rgba(150,100,125,.08);
}

.cover{
  position:relative;
  min-height:180px;
  background:#f8edf2;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cover img{
  width:100%;
  height:auto;
  max-height:560px;
  object-fit:contain;
  display:block;
}

.placeholder{
  padding:45px 15px;
  text-align:center;
  color:#b39da6;
  font-size:13px;
  line-height:1.5;
}

.status{
  position:absolute;
  right:10px;
  top:10px;
  border-radius:999px;
  padding:6px 10px;
  background:#fff;
  font-size:11px;
  font-weight:800;
  box-shadow:0 2px 8px #0001;
  color:#d76d99;
}

.status.closed{
  color:#777;
}

.card-body{
  padding:17px;
}

.card h2{
  margin:0 0 4px;
  font-size:19px;
  line-height:1.25;
  font-weight:800;
}

.type-label{
  font-size:12px;
  color:#d47f9f;
  margin-bottom:8px;
}

.owner{
  margin:0;
  color:#9a858e;
  font-size:13px;
}

.price{
  margin:9px 0;
  color:#df729f;
  font-size:18px;
  font-weight:800;
  line-height:1.3;
}

.details{
  margin:8px 0 0;
  padding-left:18px;
  color:#65555d;
  font-size:14px;
  line-height:1.75;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.tag{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:5px 9px;
  background:#fff0f6;
  color:#bd6289;
  font-size:12px;
}

.empty,
.loading{
  text-align:center;
  color:#9b858e;
  padding:45px 10px;
}

.error{
  padding:20px;
  border-radius:18px;
  background:#fff0f0;
  color:#b34e4e;
  line-height:1.6;
}

@media(max-width:600px){

  .page{
    padding:0 16px 55px;
  }

  header{
    padding:38px 18px 34px;
  }

  header h1{
    font-size:24px;
  }

  header p{
    font-size:17px;
  }

  .card{
    border-radius:21px;
  }

  .card-body{
    padding:17px;
  }

  .card h2{
    font-size:19px;
  }

  .price{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="page">

<header>
  <h1>NIMURI — Bases ♡</h1>
  <p>Bases I draw ♡</p>
</header>

<section class="filter-section">

  <h3 class="section-title">ประเภท</h3>

  <div class="pills" id="typeFilters">

    <button class="pill active" data-type="">
      ทั้งหมด
    </button>

    <button class="pill" data-type="จิบิเดี่ยว">
      จิบิเดี่ยว
    </button>

    <button class="pill" data-type="จิบิคู่">
      จิบิคู่
    </button>

    <button class="pill" data-type="สเกลปกติ เดี่ยว">
      สเกลปกติ เดี่ยว
    </button>

    <button class="pill" data-type="สเกลปกติ คู่">
      สเกลปกติ คู่
    </button>

  </div>

</section>

<section class="filter-section">

  <h3 class="section-title">สถานะรับงาน</h3>

  <div class="pills" id="statusFilters">

    <button class="pill active" data-status="">
      ทั้งหมด
    </button>

    <button class="pill" data-status="open">
      ♡ เปิดรับ
    </button>

    <button class="pill" data-status="closed">
      ปิดรับ
    </button>

  </div>

</section>

<section class="base-summary" aria-live="polite">

  <div class="base-summary-total">
    ♡ Base ทั้งหมด <span id="summaryTotal">0</span> เบส
  </div>

  <div class="base-summary-status">

    <span class="open">
      ♡ เปิดรับ <span id="summaryOpen">0</span> เบส
    </span>

    <span>·</span>

    <span class="closed">
      ♡ ปิดรับ <span id="summaryClosed">0</span> เบส
    </span>

  </div>

</section>

<div id="count" class="count"></div>

<div id="list" class="list">

  <div class="loading">
    กำลังโหลด Base ♡
  </div>

</div>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ncczyxjtcnchnzvrbtvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_8mVfjFwyZmo30YTOoRL-sw_o1IJ9DWm";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let bases = [];

let selectedType = "";

let selectedStatus = "";


/* =========================================================
   ELEMENTS
========================================================= */

const list =
  document.getElementById("list");

const count =
  document.getElementById("count");

const summaryTotal =
  document.getElementById("summaryTotal");

const summaryOpen =
  document.getElementById("summaryOpen");

const summaryClosed =
  document.getElementById("summaryClosed");


/* =========================================================
   SECURITY / HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    function(match){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[match];

    }
  );

}


/* =========================================================
   STATUS
   อ่านจาก bases.status โดยตรง
========================================================= */

function getStatus(base){

  const value =
    String(base.status ?? "")
      .trim()
      .toLowerCase();

  if(
    value === "closed" ||
    value === "close" ||
    value === "ปิดรับ" ||
    value === "ไม่รับ" ||
    value === "unavailable"
  ){

    return "closed";

  }

  return "open";

}


/* =========================================================
   IMAGE
   อ่านจาก bases.image_path โดยตรง
========================================================= */

function imageFor(base){

  const path =
    String(base.image_path ?? "")
      .trim();

  if(!path){

    return "";

  }

  const result =
    db.storage
      .from("base-images")
      .getPublicUrl(path);

  return (
    result?.data?.publicUrl ||
    ""
  );

}


/* =========================================================
   TYPE
========================================================= */

function typeFor(base){

  return String(
    base.type ?? ""
  ).trim();

}


/* =========================================================
   PRICE
========================================================= */

function priceText(base){

  const price =
    base.price == null
      ? ""
      : base.price;

  const commercial =
    base.commercial_x2 === true ||
    String(base.commercial_x2)
      .toLowerCase() === "true";

  return `
    PRICE : ${escapeHTML(price)}B
    · เชิงพาณิชย์ ${commercial ? "×2" : "×1"}
  `;

}


/* =========================================================
   DETAILS
========================================================= */

function detailsFor(base){

  const notes =
    String(base.notes ?? "")
      .trim();

  if(!notes){

    const result = [];

    if(base.max_orders){

      result.push(
        `1คนสั่งได้สูงสุด ${base.max_orders}งาน (ต่อรอบ)`
      );

    }

    return result;

  }

  return notes
    .split(/\n|•/)
    .map(
      item => item.trim()
    )
    .filter(Boolean);

}


/* =========================================================
   FILTER BUTTONS
========================================================= */

function updateFilterButtons(){

  document
    .querySelectorAll(
      "#typeFilters .pill"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.type === selectedType
      );

    });


  document
    .querySelectorAll(
      "#statusFilters .pill"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.status === selectedStatus
      );

    });

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(){

  let open = 0;

  let closed = 0;

  for(const base of bases){

    if(getStatus(base) === "closed"){

      closed++;

    }else{

      open++;

    }

  }

  summaryTotal.textContent =
    bases.length;

  summaryOpen.textContent =
    open;

  summaryClosed.textContent =
    closed;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  updateFilterButtons();

  const filtered =
    bases.filter(base => {

      const type =
        typeFor(base);

      const status =
        getStatus(base);

      const typeOK =
        !selectedType ||
        type.includes(selectedType);

      const statusOK =
        !selectedStatus ||
        status === selectedStatus;

      return typeOK && statusOK;

    });


  count.textContent =
    `พบ ${filtered.length} จาก ${bases.length} Base`;


  if(filtered.length === 0){

    list.innerHTML =
      `
        <div class="empty">
          ไม่พบ Base ตามตัวกรองนี้ ♡
        </div>
      `;

    return;

  }


  list.innerHTML =
    filtered.map(base => {

      const status =
        getStatus(base);

      const image =
        imageFor(base);

      const details =
        detailsFor(base);

      const tags =
        Array.isArray(base.tags)
          ? base.tags
          : [];


      const title =
        escapeHTML(
          base.name ||
          "ไม่มีชื่อ"
        );


      const type =
        escapeHTML(
          typeFor(base) ||
          "ไม่ระบุประเภท"
        );


      const owner =
        escapeHTML(
          base.owner_name ||
          "ไม่ระบุ"
        );


      const alt =
        escapeHTML(
          base.name ||
          "NIMURI Base"
        );


      const imageHTML =
        image
          ? `
            <img
              src="${escapeHTML(image)}"
              alt="${alt}"
              loading="lazy"
              onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
            >
            <div
              class="placeholder"
              style="display:none"
            >
              ไม่สามารถโหลดรูปได้
            </div>
          `
          : `
            <div class="placeholder">
              ยังไม่มีรูป Base
            </div>
          `;


      const detailsHTML =
        details.length
          ? `
            <ul class="details">
              ${details.map(item => `
                <li>
                  ${escapeHTML(item)}
                </li>
              `).join("")}
            </ul>
          `
          : "";


      const tagsHTML =
        tags.length
          ? `
            <div class="tags">
              ${tags.map(tag => `
                <span class="tag">
                  ${escapeHTML(tag)}
                </span>
              `).join("")}
            </div>
          `
          : "";


      return `
        <article class="card">

          <div class="cover">

            ${imageHTML}

            <div
              class="status ${status === "closed" ? "closed" : ""}"
            >
              ${status === "open" ? "OPEN" : "CLOSED"}
            </div>

          </div>


          <div class="card-body">

            <h2>
              ${title}
            </h2>

            <div class="type-label">
              ${type}
            </div>

            <div class="owner">
              base: ${owner}
            </div>

            <div class="price">
              ${priceText(base)}
            </div>

            ${detailsHTML}

            ${tagsHTML}

          </div>

        </article>
      `;

    }).join("");

}


/* =========================================================
   TYPE FILTER
========================================================= */

document
  .querySelectorAll(
    "#typeFilters .pill"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      function(){

        selectedType =
          this.dataset.type || "";

        render();

      }
    );

  });


/* =========================================================
   STATUS FILTER
========================================================= */

document
  .querySelectorAll(
    "#statusFilters .pill"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      function(){

        selectedStatus =
          this.dataset.status || "";

        render();

      }
    );

  });


/* =========================================================
   LOAD
========================================================= */

async function load(){

  list.innerHTML =
    `
      <div class="loading">
        กำลังโหลด Base ♡
      </div>
    `;


  /*
    ---------------------------------------------------------
    1. อ่าน BASES โดยตรง

    ตารางนี้มี:
    id
    name
    owner_id
    price
    commercial_x2
    max_orders
    type
    notes
    status
    image_path
    ---------------------------------------------------------
  */

  const baseResult =
    await db
      .from("bases")
      .select(`
        id,
        name,
        owner_id,
        price,
        commercial_x2,
        max_orders,
        type,
        notes,
        status,
        image_path
      `)
      .order(
        "id",
        {
          ascending:true
        }
      );


  if(baseResult.error){

    console.error(
      "BASE ERROR:",
      baseResult.error
    );

    list.innerHTML =
      `
        <div class="error">

          โหลด Base ไม่สำเร็จค่ะ 🥺

          <br><br>

          ${escapeHTML(
            baseResult.error.message
          )}

        </div>
      `;

    return;

  }


  /*
    ---------------------------------------------------------
    2. อ่าน OWNER + TAGS จาก VIEW เดิม
    ---------------------------------------------------------
  */

  const metaResult =
    await db
      .from("bases_with_tags")
      .select(`
        id,
        owner_name,
        tags
      `);


  if(metaResult.error){

    console.warn(
      "META ERROR:",
      metaResult.error
    );

  }


  /*
    ---------------------------------------------------------
    3. ทำ Map เพื่อจับคู่ด้วย ID
    ---------------------------------------------------------
  */

  const metaMap =
    new Map(
      (metaResult.data || [])
        .map(row => [
          row.id,
          row
        ])
    );


  /*
    ---------------------------------------------------------
    4. รวม BASES + OWNER + TAGS
    ---------------------------------------------------------
  */

  bases =
    (baseResult.data || [])
      .map(base => {

        const meta =
          metaMap.get(base.id) || {};

        return {

          ...base,

          owner_name:
            meta.owner_name || "",

          tags:
            Array.isArray(meta.tags)
              ? meta.tags
              : []

        };

      });


  /*
    ---------------------------------------------------------
    5. แสดงผล
    ---------------------------------------------------------
  */

  updateSummary();

  render();

}


/* =========================================================
   START
========================================================= */

load();

</script>

</body>
</html>
