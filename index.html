<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>NIMURI — Bases ♡</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#fff7fb;
  --white:#fff;
  --pink:#ef9fbe;
  --pink-strong:#df729f;
  --line:#efd8e2;
  --text:#40343a;
  --muted:#9b858e;
  --soft:#f8edf2;
  --dark:#44373e;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  font-size:14px;
}

button{
  font:inherit;
}

.page{
  width:min(100%,1120px);
  margin:0 auto;
  padding:0 16px 55px;
}

header{
  text-align:center;
  padding:38px 18px 34px;
}

header h1{
  margin:0;
  font-size:29px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:-.6px;
}

header p{
  margin:8px 0 0;
  color:#a18491;
  font-size:17px;
}

.section-title{
  font-size:13px;
  font-weight:700;
  color:#8e737f;
  margin:0 0 9px;
}

.filter-section{
  margin:0 0 22px;
}

.pills{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.pill{
  border:1px solid #eccbd9;
  background:#fff;
  color:#806773;
  padding:9px 14px;
  border-radius:999px;
  cursor:pointer;
  white-space:nowrap;
  transition:.16s ease;
}

.pill:hover{
  transform:translateY(-1px);
}

.pill.active{
  background:#ef9fbe;
  color:#fff;
  border-color:#ef9fbe;
}

/* กล่องสรุป Base แยกของตัวเอง */
.base-summary{
  background:#fff;
  border:1px solid #efd8e2;
  border-radius:18px;
  padding:14px 16px;
  margin:0 0 22px;
  text-align:center;
  box-shadow:0 5px 18px rgba(150,100,125,.05);
}

.base-summary-total{
  color:#9a7585;
  font-size:15px;
  font-weight:400;
  line-height:1.5;
}

.base-summary-status{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:3px;
  color:#a18491;
  font-size:13px;
  font-weight:400;
}

.base-summary-status .open{
  color:#d47f9f;
  font-weight:400;
}

.base-summary-status .closed{
  color:#a18491;
  font-weight:400;
}

.count{
  display:none;
}

.list{
  display:grid;
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid #efd8e2;
  border-radius:21px;
  overflow:hidden;
  box-shadow:0 7px 24px rgba(150,100,125,.08);
}

.cover{
  position:relative;
  min-height:180px;
  background:#f8edf2;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cover img{
  width:100%;
  height:auto;
  max-height:560px;
  object-fit:contain;
  display:block;
}

.placeholder{
  padding:45px 15px;
  text-align:center;
  color:#b39da6;
  font-size:13px;
  line-height:1.5;
}

.status{
  position:absolute;
  right:10px;
  top:10px;
  border-radius:999px;
  padding:6px 9px;
  background:#fff;
  font-size:11px;
  font-weight:800;
  box-shadow:0 2px 8px #0001;
  color:#d76d99;
}

.status.closed{
  color:#777;
}

.card-body{
  padding:17px;
}

.card h2{
  margin:0 0 4px;
  font-size:19px;
  line-height:1.25;
  font-weight:800;
}

.type-label{
  font-size:12px;
  color:#d47f9f;
  margin-bottom:8px;
}

.owner{
  margin:0;
  color:#9a858e;
  font-size:13px;
}

.price{
  margin:9px 0;
  color:#df729f;
  font-size:18px;
  font-weight:800;
  line-height:1.3;
}

.details{
  margin:8px 0 0;
  padding-left:18px;
  color:#65555d;
  font-size:14px;
  line-height:1.75;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  padding:5px 9px;
  background:#fff0f6;
  color:#bd6289;
  font-size:12px;
}

.empty{
  text-align:center;
  color:#9b858e;
  padding:45px 10px;
}

.error{
  padding:20px;
  border-radius:18px;
  background:#fff0f0;
  color:#b34e4e;
  line-height:1.5;
}

.loading{
  text-align:center;
  color:#9b858e;
  padding:45px 10px;
}

@media(max-width:600px){

  .page{
    padding:0 16px 55px;
  }

  header{
    padding:38px 18px 34px;
  }

  header h1{
    font-size:24px;
    letter-spacing:-.3px;
  }

  header p{
    font-size:17px;
  }

  .filter-section{
    margin-bottom:22px;
  }

  .base-summary{
    border-radius:18px;
    padding:13px 14px;
  }

  .base-summary-total{
    font-size:14px;
  }

  .base-summary-status{
    font-size:13px;
  }

  .card{
    border-radius:21px;
  }

  .cover{
    min-height:180px;
  }

  .card-body{
    padding:17px;
  }

  .card h2{
    font-size:19px;
  }

  .price{
    font-size:18px;
  }

  .details{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="page">

<header>
  <h1>NIMURI — Bases ♡</h1>
  <p>Bases I draw ♡</p>
</header>


<!-- ประเภท -->
<section class="filter-section">

  <h3 class="section-title">ประเภท</h3>

  <div class="pills" id="typeFilters">

    <button class="pill active" data-type="">
      ทั้งหมด
    </button>

    <button class="pill" data-type="จิบิเดี่ยว">
      จิบิเดี่ยว
    </button>

    <button class="pill" data-type="จิบิคู่">
      จิบิคู่
    </button>

    <button class="pill" data-type="สเกลปกติ เดี่ยว">
      สเกลปกติ เดี่ยว
    </button>

    <button class="pill" data-type="สเกลปกติ คู่">
      สเกลปกติ คู่
    </button>

  </div>

</section>


<!-- สถานะรับงาน -->
<section class="filter-section">

  <h3 class="section-title">สถานะรับงาน</h3>

  <div class="pills" id="statusFilters">

    <button class="pill active" data-status="">
      ทั้งหมด
    </button>

    <button class="pill" data-status="open">
      ♡ เปิดรับ
    </button>

    <button class="pill" data-status="closed">
      ปิดรับ
    </button>

  </div>

</section>


<!-- กล่องสรุป Base แยกของตัวเอง -->
<section class="base-summary" aria-live="polite">

  <div class="base-summary-total">
    ♡ Base ทั้งหมด <span id="summaryTotal">0</span> เบส
  </div>

  <div class="base-summary-status">

    <span class="open">
      ♡ เปิดรับ <span id="summaryOpen">0</span> เบส
    </span>

    <span>·</span>

    <span class="closed">
      ♡ ปิดรับ <span id="summaryClosed">0</span> เบส
    </span>

  </div>

</section>


<div id="count" class="count">
  กำลังโหลด...
</div>


<div id="list" class="list">

  <div class="loading">
    กำลังโหลด Base ♡
  </div>

</div>

</div>


<script>

const db=supabase.createClient(
  "https://ncczyxjtcnchnzvrbtvy.supabase.co",
  "sb_publishable_8mVfjFwyZmo30YTOoRL-sw_o1IJ9DWm"
);


let bases=[];

let selectedType="";

let selectedStatus="";


const list=document.getElementById("list");

const count=document.getElementById("count");

const summaryTotal=document.getElementById("summaryTotal");

const summaryOpen=document.getElementById("summaryOpen");

const summaryClosed=document.getElementById("summaryClosed");


function escapeHTML(value){

  return String(value??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/* อ่านสถานะจาก Supabase เท่านั้น */
function getStatus(b){

  const raw=String(
    b.status ??
    b.state ??
    b.availability ??
    ""
  ).trim().toLowerCase();


  if(
    [
      "closed",
      "close",
      "ปิดรับ",
      "ไม่รับ",
      "unavailable"
    ].some(x=>raw.includes(x))
  ){

    return "closed";

  }


  if(
    [
      "open",
      "opened",
      "เปิดรับ",
      "รับงาน",
      "available"
    ].some(x=>raw.includes(x))
  ){

    return "open";

  }


  if(
    b.is_open===false ||
    b.open===false
  ){

    return "closed";

  }


  return "open";

}


/* อัปเดตจำนวน Base */
function updateSummary(){

  let open=0;

  let closed=0;


  bases.forEach(b=>{

    if(getStatus(b)==="open"){

      open++;

    }else{

      closed++;

    }

  });


  summaryTotal.textContent=bases.length;

  summaryOpen.textContent=open;

  summaryClosed.textContent=closed;

}


/* รูป */
function imageFor(b){

  return (
    b.image_url ||
    b.image ||
    b.image_path ||
    b.cover_url ||
    "images/base-01.png"
  );

}


/* ประเภท */
function typeFor(b){

  return String(
    b.type ||
    b.category ||
    ""
  ).trim();

}


/* ราคา */
function priceText(b){

  const price=
    b.price==null
      ? ""
      : b.price;


  const commercial=
    b.commercial_x2===true ||
    String(b.commercial_x2)
      .toLowerCase()==="true";


  return `
    PRICE : ${escapeHTML(price)}B
    · เชิงพาณิชย์ ${commercial?"×2":"×1"}
  `;

}


/* รายละเอียด */
function detailsFor(b){

  if(Array.isArray(b.details)){

    return b.details.filter(Boolean);

  }


  if(Array.isArray(b.notes)){

    return b.notes.filter(Boolean);

  }


  const notes=
    String(b.notes||"").trim();


  if(notes){

    return notes
      .split(/\n|•/)
      .map(x=>x.trim())
      .filter(Boolean);

  }


  const result=[];


  if(b.expressions){

    result.push(
      `มีสีหน้าให้เลือกถึง ${b.expressions} สีหน้า`
    );

  }


  if(b.addons){

    result.push(
      `เพิ่มของถือ ${b.addons}`
    );

  }


  if(b.max_orders){

    result.push(
      `1คนสั่งได้สูงสุด ${b.max_orders}งาน (ต่อรอบ)`
    );

  }


  return result;

}


/* ปุ่มตัวกรอง */
function filterButtons(){

  document
    .querySelectorAll("#typeFilters .pill")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.type===selectedType
      );

    });


  document
    .querySelectorAll("#statusFilters .pill")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.status===selectedStatus
      );

    });

}


/* แสดง Base */
function render(){

  filterButtons();


  const result=
    bases.filter(b=>{

      const t=typeFor(b);

      const s=getStatus(b);


      const typeOK=
        !selectedType ||
        t.includes(selectedType);


      const statusOK=
        !selectedStatus ||
        s===selectedStatus;


      return typeOK && statusOK;

    });


  count.textContent=
    `พบ ${result.length} จาก ${bases.length} Base`;


  if(!result.length){

    list.innerHTML=
      '<div class="empty">ไม่พบ Base ตามตัวกรองนี้ ♡</div>';

    return;

  }


  list.innerHTML=
    result.map(b=>{

      const s=getStatus(b);

      const details=
        detailsFor(b);


      const tags=
        Array.isArray(b.tags)
          ? b.tags
          : [];


      const image=
        imageFor(b);


      const title=
        escapeHTML(
          b.name ||
          "ไม่มีชื่อ"
        );


      const type=
        escapeHTML(
          typeFor(b) ||
          "ไม่ระบุประเภท"
        );


      const owner=
        escapeHTML(
          b.owner_name ||
          b.owner ||
          "ไม่ระบุ"
        );


      const alt=
        escapeHTML(
          b.name ||
          "Nimuri Base"
        );


      return `

        <article class="card">

          <div class="cover">

            <img
              src="${escapeHTML(image)}"
              alt="${alt}"
              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='block'
              "
            >

            <div
              class="placeholder"
              style="display:none"
            >
              ใส่รูปที่<br>
              ${escapeHTML(image)}
            </div>


            <div
              class="status ${s==="closed"?"closed":""}"
            >
              ${s==="open"?"OPEN":"CLOSED"}
            </div>

          </div>


          <div class="card-body">

            <h2>
              ${title}
            </h2>


            <div class="type-label">
              ${type}
            </div>


            <div class="owner">
              baes: ${owner}
            </div>


            <div class="price">
              ${priceText(b)}
            </div>


            ${
              details.length
              ?`

                <ul class="details">

                  ${details
                    .map(
                      x=>`
                        <li>
                          ${escapeHTML(x)}
                        </li>
                      `
                    )
                    .join("")
                  }

                </ul>

              `
              :""
            }


            ${
              tags.length
              ?`

                <div class="tags">

                  ${tags
                    .map(
                      x=>`
                        <span class="tag">
                          ${escapeHTML(x)}
                        </span>
                      `
                    )
                    .join("")
                  }

                </div>

              `
              :""
            }

          </div>

        </article>

      `;

    }).join("");

}


/* กรองประเภท */
document
  .querySelectorAll("#typeFilters .pill")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        selectedType=
          btn.dataset.type;

        render();

      }
    );

  });


/* กรองสถานะ */
document
  .querySelectorAll("#statusFilters .pill")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        selectedStatus=
          btn.dataset.status;

        render();

      }
    );

  });


/* โหลดข้อมูลจาก Supabase */
async function load(){

  const result=
    await db
      .from("bases_with_tags")
      .select("*")
      .order(
        "id",
        {ascending:true}
      );


  if(result.error){

    console.log(
      result.error
    );


    list.innerHTML=
      `
        <div class="error">

          โหลดข้อมูลไม่สำเร็จค่ะ 🥺

          <br>

          ${escapeHTML(
            result.error.message
          )}

        </div>
      `;


    count.textContent="";

    return;

  }


  bases=
    result.data || [];


  updateSummary();

  render();

}


load();

</script>

</body>
</html>
