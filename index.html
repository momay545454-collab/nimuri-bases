function imageFor(b){

  const path =
    b.image_path;

  if(path){

    const result =
      db.storage
        .from("base-images")
        .getPublicUrl(path);

    return (
      result.data?.publicUrl ||
      "images/base-01.png"
    );

  }

  return (
    b.image_url ||
    b.image ||
    b.cover_url ||
    "images/base-01.png"
  );

}
