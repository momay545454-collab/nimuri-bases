<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIMURI — Admin</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#fff7fb;
  --white:#fff;
  --pink:#ef9fbe;
  --pink2:#df729f;
  --line:#efd8e2;
  --text:#40343a;
  --muted:#9b858e;
  --dark:#44373e
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  font-size:14px
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

header{
  text-align:center;
  padding:30px 16px 22px
}

header h1{
  margin:0;
  font-size:27px
}

header p{
  margin:7px 0 0;
  color:var(--muted)
}

.wrap{
  width:min(100%,980px);
  margin:auto;
  padding:0 14px 50px
}

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:17px;
  margin-bottom:16px;
  box-shadow:0 6px 22px rgba(150,100,125,.06)
}

.row{
  display:flex;
  gap:10px;
  align-items:center
}

.between{
  justify-content:space-between
}

h2{
  margin:0 0 8px;
  font-size:18px
}

.muted{
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin:12px 0 0
}

input,select,textarea{
  width:100%;
  margin-top:6px;
  border:1px solid #ead1dc;
  border-radius:12px;
  background:#fff;
  padding:11px 12px;
  color:var(--text);
  outline:none
}

textarea{
  resize:vertical
}

.primary,.secondary,.danger{
  border-radius:11px;
  padding:10px 14px
}

.primary{
  background:var(--dark);
  color:#fff;
  border:0
}

.secondary{
  background:#fff;
  border:1px solid #e6ccd8;
  color:#725d67
}

.danger{
  background:#fff0f2;
  color:#c65d70;
  border:1px solid #f0cbd2
}

.small{
  padding:8px 11px;
  font-size:12px
}

.msg{
  color:#b35f84;
  min-height:18px
}

.list{
  display:grid;
  gap:10px
}

.item{
  border:1px solid #f0dfe6;
  border-radius:15px;
  padding:13px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end
}

.chips{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:7px
}

.chips span{
  background:#fff0f6;
  color:#bd6289;
  border-radius:999px;
  padding:4px 8px;
  font-size:11px
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(60,40,50,.28);
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:10px;
  z-index:20
}

.modal.show{
  display:flex
}

.modal-card{
  width:min(100%,680px);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:18px;
  position:relative
}

.close{
  position:absolute;
  right:12px;
  top:10px;
  border:0;
  background:#f8edf2;
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:22px;
  color:#7d6570
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.check{
  display:flex;
  align-items:center;
  gap:7px;
  background:#fff8fb;
  border:1px solid #efdde5;
  border-radius:10px;
  padding:9px;
  font-weight:500
}

.check input{
  width:auto;
  margin:0
}

.image-box{
  border:1px dashed #e6bfd0;
  border-radius:15px;
  padding:12px;
  margin-top:7px;
  background:#fffafd
}

.preview{
  width:100%;
  max-height:260px;
  object-fit:contain;
  border-radius:12px;
  background:#f8edf2;
  margin-top:9px;
  display:none
}

.status-open{
  color:#27885c;
  font-weight:700
}

.status-closed{
  color:#c65d70;
  font-weight:700
}

@media(max-width:600px){
  header h1{font-size:24px}

  .row,.item{
    align-items:flex-start;
    flex-direction:column
  }

  .actions{
    width:100%;
    justify-content:flex-start
  }

  .actions button{
    flex:1
  }

  .grid2{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
  <h1>NIMURI — Owner ♡</h1>
  <p>จัดการ Bases</p>
</header>

<div class="wrap">

  <!-- LOGIN -->
  <div id="loginBox" class="panel">

    <h2>🔐 เข้าสู่หน้าของเจ้าของ</h2>

    <label>
      อีเมล
      <input id="email" type="email" autocomplete="email">
    </label>

    <label>
      รหัสผ่าน
      <input id="password" type="password" autocomplete="current-password">
    </label>

    <button class="primary" id="loginBtn">
      เข้าสู่ระบบ
    </button>

    <p id="loginMsg" class="msg"></p>

  </div>


  <!-- APP -->
  <div id="app" style="display:none">

    <div class="panel row between">

      <div>
        <b id="who"></b>
        <div class="muted">
          จัดการข้อมูล Base ของ NIMURI
        </div>
      </div>

      <button id="logoutBtn" class="secondary">
        ออกจากระบบ
      </button>

    </div>


    <!-- TAGS -->
    <div class="panel">

      <div class="row between">

        <h2>🏷️ แท็ก</h2>

        <button class="primary small" id="newTagBtn">
          + เพิ่มแท็ก
        </button>

      </div>

      <div id="tagList" class="list"></div>

    </div>


    <!-- BASES -->
    <div class="panel">

      <div class="row between">

        <h2>🎨 Bases</h2>

        <button class="primary small" id="newBaseBtn">
          + เพิ่ม Base
        </button>

      </div>

      <div id="baseList" class="list"></div>

    </div>

  </div>

</div>


<!-- MODAL -->
<div id="modal" class="modal">

  <div class="modal-card">

    <button class="close" id="closeModal">×</button>

    <h2 id="modalTitle"></h2>

    <div id="modalBody"></div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://ncczyxjtcnchnzvrbtvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_8mVfjFwyZmo30YTOoRL-sw_o1IJ9DWm";

const IMAGE_BUCKET = "base-images";

let sb;
let bases = [];
let tags = [];
let owners = [];

const $ = id => document.getElementById(id);

function esc(s){
  return String(s ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );
}


/* =========================
   TYPE LABELS
========================= */

const typeLabels = {
  "chibi-single":"จิบิเดี่ยว",
  "chibi-pair":"จิบิคู่",
  "normal-single":"สเกลปกติ เดี่ยว",
  "normal-pair":"สเกลปกติ คู่"
};


/* =========================
   START
========================= */

async function start(){

  sb = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const {
    data:{session}
  } = await sb.auth.getSession();

  if(session){
    await showApp(session);
  }

  sb.auth.onAuthStateChange(
    async (_event,session) => {

      if(session){
        await showApp(session);
      }else{
        showLogin();
      }

    }
  );

}


/* =========================
   LOGIN
========================= */

$('loginBtn').onclick = async()=>{

  $('loginMsg').textContent = '';

  const {
    error
  } = await sb.auth.signInWithPassword({

    email:$('email').value.trim(),

    password:$('password').value

  });

  if(error){
    $('loginMsg').textContent =
      error.message;
  }

};


$('logoutBtn').onclick = async()=>{

  await sb.auth.signOut();

};


function showLogin(){

  $('loginBox').style.display =
    'block';

  $('app').style.display =
    'none';

}


async function showApp(session){

  $('loginBox').style.display =
    'none';

  $('app').style.display =
    'block';

  $('who').textContent =
    session.user.email || 'เจ้าของ';

  await load();

}


/* =========================
   LOAD
========================= */

async function load(){

  const [
    b,
    t,
    bt,
    o
  ] = await Promise.all([

    sb
      .from('bases')
      .select('*')
      .order('id'),

    sb
      .from('tags')
      .select('*')
      .order('name'),

    sb
      .from('base_tags')
      .select('base_id,tag_id'),

    sb
      .from('owners')
      .select('*')
      .order('id')

  ]);


  if(
    b.error ||
    t.error ||
    bt.error ||
    o.error
  ){

    alert(
      'โหลดข้อมูลไม่สำเร็จ: ' +
      (
        b.error?.message ||
        t.error?.message ||
        bt.error?.message ||
        o.error?.message
      )
    );

    return;
  }


  const tagMap = {};

  (bt.data || []).forEach(x=>{

    if(!tagMap[x.base_id]){
      tagMap[x.base_id] = [];
    }

    tagMap[x.base_id].push(x.tag_id);

  });


  bases =
    (b.data || []).map(x=>({

      ...x,

      tag_ids:
        tagMap[x.id] || []

    }));


  tags = t.data || [];
  owners = o.data || [];


  renderTags();
  renderBases();

}


/* =========================
   TAGS
========================= */

function renderTags(){

  $('tagList').innerHTML =

    tags.map(t=>`

      <div class="item">

        <b>${esc(t.name)}</b>

        <div class="actions">

          <button
            class="secondary small"
            onclick="renameTag(${t.id})">
            แก้ชื่อ
          </button>

          <button
            class="danger small"
            onclick="deleteTag(${t.id})">
            ลบ
          </button>

        </div>

      </div>

    `).join('')

    ||

    '<div class="muted">ยังไม่มีแท็ก</div>';

}


$('newTagBtn').onclick = ()=>{

  openModal(
    'เพิ่มแท็ก',
    `

      <label>
        ชื่อแท็ก
        <input id="tagName">
      </label>

      <button
        class="primary"
        style="margin-top:14px"
        onclick="createTag()">
        เพิ่มแท็ก
      </button>

    `
  );

};


async function createTag(){

  const name =
    $('tagName').value.trim();

  if(!name){
    return;
  }

  const {error} =
    await sb
      .from('tags')
      .insert({name});

  if(error){

    alert(
      'สร้างแท็กไม่สำเร็จ: ' +
      error.message
    );

    return;
  }

  closeModal();
  load();

}


async function renameTag(id){

  const tag =
    tags.find(x => x.id == id);

  if(!tag){
    return;
  }

  const name =
    prompt(
      'ชื่อแท็กใหม่',
      tag.name
    );

  if(
    !name ||
    name.trim() === tag.name
  ){
    return;
  }

  const {error} =
    await sb
      .from('tags')
      .update({
        name:name.trim()
      })
      .eq('id',id);

  if(error){

    alert(error.message);

  }else{

    load();

  }

}


async function deleteTag(id){

  if(
    !confirm(
      'ลบแท็กนี้หรือไม่?'
    )
  ){
    return;
  }

  const {error} =
    await sb
      .from('tags')
      .delete()
      .eq('id',id);

  if(error){

    alert(error.message);

  }else{

    load();

  }

}


/* =========================
   BASE LIST
========================= */

function ownerName(id){

  const o =
    owners.find(x => x.id == id);

  return o?.name || 'ไม่ระบุเจ้าของ';

}


function renderBases(){

  $('baseList').innerHTML =

    bases.map(b=>{

      const isOpen =
        b.status !== 'closed';

      return `

        <div class="item">

          <div style="min-width:0">

            <b>
              ${esc(b.name)}
            </b>

            <div class="muted">

              ${esc(
                typeLabels[b.type] ||
                b.type ||
                '-'
              )}

              · ${Number(b.price) || 0} บาท

              · ${esc(ownerName(b.owner_id))}

            </div>

            <div
              class="${isOpen
                ? 'status-open'
                : 'status-closed'}">

              ${isOpen
                ? '🟢 เปิดรับ'
                : '🔴 ปิดรับ'}

            </div>

            <div class="chips">

              ${
                b.tag_ids.map(id=>{

                  const t =
                    tags.find(x=>x.id == id);

                  return t
                    ? `<span>${esc(t.name)}</span>`
                    : '';

                }).join('')
              }

            </div>

          </div>


          <div class="actions">

            <button
              class="secondary small"
              onclick="editBase(${b.id})">
              ✏️ แก้ไข
            </button>

            <button
              class="secondary small"
              onclick="toggleStatus(${b.id})">

              ${isOpen
                ? '🔴 ปิดรับ'
                : '🟢 เปิดรับ'}

            </button>

            <button
              class="danger small"
              onclick="deleteBase(${b.id})">
              ลบ
            </button>

          </div>

        </div>

      `;

    }).join('')

    ||

    '<div class="muted">ยังไม่มี Base</div>';

}


/* =========================
   MODAL
========================= */

function openModal(title,html){

  $('modalTitle').textContent =
    title;

  $('modalBody').innerHTML =
    html;

  $('modal').classList.add('show');

}


function closeModal(){

  $('modal').classList.remove('show');

}


$('closeModal').onclick =
  closeModal;


$('modal').onclick = e=>{

  if(e.target === $('modal')){
    closeModal();
  }

};


/* =========================
   BASE FORM
========================= */

$('newBaseBtn').onclick =
  ()=>showBaseForm();


function showBaseForm(base=null){

  const notes =
    base?.notes || '';

  const status =
    base?.status || 'open';


  openModal(

    base
      ? '✏️ แก้ไข Base'
      : '✨ เพิ่ม Base',

    `

      <label>
        ชื่อ Base
        <input
          id="fName"
          value="${esc(base?.name || '')}"
          placeholder="ชื่อ Base">
      </label>


      <div class="grid2">

        <label>
          เจ้าของ

          <select id="fOwner">

            <option value="">
              — เลือกเจ้าของ —
            </option>

            ${
              owners.map(o=>`

                <option
                  value="${o.id}"
                  ${String(base?.owner_id) === String(o.id)
                    ? 'selected'
                    : ''}>

                  ${esc(o.name)}

                </option>

              `).join('')
            }

          </select>

        </label>


        <label>
          ราคา (บาท)

          <input
            id="fPrice"
            type="number"
            min="0"
            value="${Number(base?.price) || 0}">

        </label>

      </div>


      <div class="grid2">

        <label>
          ประเภท

          <select id="fType">

            ${
              Object.entries(typeLabels)
                .map(([key,label])=>`

                  <option
                    value="${key}"
                    ${base?.type === key
                      ? 'selected'
                      : ''}>

                    ${label}

                  </option>

                `).join('')
            }

          </select>

        </label>


        <label>
          จำนวนงานสูงสุด

          <input
            id="fMaxOrders"
            type="number"
            min="0"
            value="${Number(base?.max_orders) || 0}">

        </label>

      </div>


      <label>

        สถานะรับงาน

        <select id="fStatus">

          <option
            value="open"
            ${status !== 'closed'
              ? 'selected'
              : ''}>
            🟢 เปิดรับ
          </option>

          <option
            value="closed"
            ${status === 'closed'
              ? 'selected'
              : ''}>
            🔴 ปิดรับ
          </option>

        </select>

      </label>


      <label class="check" style="margin-top:14px">

        <input
          id="fCommercial"
          type="checkbox"
          ${base?.commercial_x2 ? 'checked' : ''}>

        Commercial ×2

      </label>


      <label>

        รายละเอียด

        <textarea
          id="fNotes"
          rows="6"
          placeholder="รายละเอียดของ Base">${esc(notes)}</textarea>

      </label>


      <label>
        รูปภาพ Base
      </label>


      <div class="image-box">

        <div class="muted">
          เลือกรูปจากมือถือหรือคอมพิวเตอร์ได้เลย
        </div>

        <input
          id="fImage"
          type="file"
          accept="image/png,image/jpeg,image/webp,image/gif">

        <div
          id="fileName"
          class="muted">
        </div>

        <img
          id="imagePreview"
          class="preview"
          alt="ตัวอย่างรูป">

      </div>


      <div style="margin-top:15px;font-weight:700">
        🏷️ แท็ก
      </div>


      <div
        style="
          display:grid;
          grid-template-columns:repeat(2,minmax(0,1fr));
          gap:8px;
          margin-top:8px">

        ${
          tags.map(t=>`

            <label class="check">

              <input
                type="checkbox"
                value="${t.id}"
                ${base?.tag_ids?.includes(t.id)
                  ? 'checked'
                  : ''}>

              ${esc(t.name)}

            </label>

          `).join('')
          ||
          '<div class="muted">ยังไม่มีแท็ก</div>'
        }

      </div>


      <div
        style="
          display:flex;
          gap:8px;
          margin-top:18px">

        <button
          class="primary"
          onclick="saveBase(${base?.id || 'null'})">

          💾 บันทึก

        </button>

        <button
          class="secondary"
          onclick="closeModal()">

          ยกเลิก

        </button>

      </div>

    `
  );


  $('fImage').addEventListener(
    'change',
    ()=>{

      const file =
        $('fImage').files[0];

      $('fileName').textContent =
        file
          ? `เลือกรูป: ${file.name}`
          : '';

      if(!file){

        $('imagePreview').style.display =
          'none';

        return;
      }

      $('imagePreview').src =
        URL.createObjectURL(file);

      $('imagePreview').style.display =
        'block';

    }
  );

}


/* =========================
   IMAGE UPLOAD
========================= */

async function uploadImage(file){

  const safe =
    file.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        '_'
      );

  const path =
    `${crypto.randomUUID()}-${safe}`;


  const {error} =
    await sb.storage
      .from(IMAGE_BUCKET)
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:file.type
        }
      );


  if(error){
    throw error;
  }


  return path;

}


/* =========================
   SAVE BASE
========================= */

async function saveBase(id){

  const oldBase =
    id
      ? bases.find(x => x.id == id)
      : null;


  const name =
    $('fName').value.trim();

  if(!name){

    alert(
      'กรุณาใส่ชื่อ Base'
    );

    return;
  }


  const ownerValue =
    $('fOwner').value;


  const payload = {

    name:name,

    owner_id:
      ownerValue
        ? Number(ownerValue)
        : null,

    price:
      Number($('fPrice').value) || 0,

    commercial_x2:
      $('fCommercial').checked,

    max_orders:
      Number($('fMaxOrders').value) || 0,

    type:
      $('fType').value,

    notes:
      $('fNotes').value.trim(),

    status:
      $('fStatus').value

  };


  let imagePath =
    oldBase?.image_path || null;


  const file =
    $('fImage').files[0];


  try{

    if(file){

      imagePath =
        await uploadImage(file);

      payload.image_path =
        imagePath;

    }


    let baseId;


    if(id){

      const {error} =
        await sb
          .from('bases')
          .update(payload)
          .eq('id',id);


      if(error){

        throw new Error(
          'บันทึก Base ไม่สำเร็จ: ' +
          error.message
        );

      }

      baseId = id;

    }else{

      const {
        data,
        error
      } =
        await sb
          .from('bases')
          .insert(payload)
          .select()
          .single();


      if(error){

        throw new Error(
          'เพิ่ม Base ไม่สำเร็จ: ' +
          error.message
        );

      }

      baseId =
        data.id;

    }


    /* TAGS */

    const {error:deleteTagError} =
      await sb
        .from('base_tags')
        .delete()
        .eq('base_id',baseId);


    if(deleteTagError){

      throw new Error(
        'จัดการแท็กไม่สำเร็จ: ' +
        deleteTagError.message
      );

    }


    const chosen =
      [
        ...document.querySelectorAll(
          '#modalBody input[type=checkbox]:checked'
        )
      ].map(x=>({

        base_id:baseId,

        tag_id:Number(x.value)

      }));


    if(chosen.length){

      const {error} =
        await sb
          .from('base_tags')
          .insert(chosen);


      if(error){

        throw new Error(
          'บันทึกแท็กไม่สำเร็จ: ' +
          error.message
        );

      }

    }


    closeModal();

    await load();


    alert(
      id
        ? 'บันทึก Base เรียบร้อยแล้ว ♡'
        : 'เพิ่ม Base เรียบร้อยแล้ว ♡'
    );


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================
   EDIT
========================= */

function editBase(id){

  const base =
    bases.find(x => x.id == id);

  if(base){
    showBaseForm(base);
  }

}


/* =========================
   STATUS
========================= */

async function toggleStatus(id){

  const base =
    bases.find(x => x.id == id);

  if(!base){
    return;
  }


  const next =
    base.status === 'closed'
      ? 'open'
      : 'closed';


  const {error} =
    await sb
      .from('bases')
      .update({
        status:next
      })
      .eq('id',id);


  if(error){

    alert(
      'เปลี่ยนสถานะไม่สำเร็จ: ' +
      error.message
    );

    return;
  }


  await load();

}


/* =========================
   DELETE
========================= */

async function deleteBase(id){

  if(
    !confirm(
      'ต้องการลบ Base นี้ถาวรหรือไม่?'
    )
  ){

    return;

  }


  const {error} =
    await sb
      .from('bases')
      .delete()
      .eq('id',id);


  if(error){

    alert(
      'ลบ Base ไม่สำเร็จ: ' +
      error.message
    );

    return;
  }


  await load();

}


/* =========================
   RUN
========================= */

start();

</script>
