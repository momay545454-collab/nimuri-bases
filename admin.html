begin;

with candidate as (
  select b.id
  from public.bases b
  where not exists (
    select 1
    from public.base_tags bt
    where bt.base_id = b.id
      and bt.tag_id = 40
  )
  order by b.id
  limit 1
)
insert into public.base_tags (base_id, tag_id)
select id, 40
from candidate
returning *;

rollback;
